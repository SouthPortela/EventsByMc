server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # O Vue Router usa history mode. Quando uma rota não corresponde a um
    # arquivo físico, o index.html assume a navegação sem recarregar a aplicação.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A barra final em proxy_pass remove /api antes de chegar à API, cujas rotas
    # reais são /eventos, /usuarios, /presencas etc.
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
