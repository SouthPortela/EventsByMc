services:
  postgres-db:
    image: postgres:16
    container_name: events_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Porta só acessível de dentro da própria máquina (127.0.0.1) — em produção,
      # a internet não deve conseguir se conectar direto no Postgres.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: events_api
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
    ports:
      # Só acessível localmente também — quem expõe pra internet é o Nginx (proxy reverso).
      - "127.0.0.1:${API_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: events_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Este é o único serviço exposto para a rede. O Nginx entrega a SPA e
      # encaminha /api para o Java pela rede interna do Docker Compose.
      - "${WEB_PORT:-80}:80"

volumes:
  pg_data:
