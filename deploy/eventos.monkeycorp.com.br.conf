# Referência dos vhosts Apache REALMENTE em produção (eventos.monkeycorp.com.br).
#
# O servidor roda Apache2 (não Nginx). Os arquivos vivos no servidor são:
#   /etc/apache2/sites-available/eventos.conf         (porta 80 — só redireciona pra HTTPS)
#   /etc/apache2/sites-available/eventos-le-ssl.conf   (porta 443 — gerenciado em parte pelo certbot)
#
# O bloco :443 é reescrito pelo certbot a cada emissão/renovação de certificado
# (os caminhos SSLCertificateFile/SSLCertificateKeyFile/Include) — não copie
# este arquivo por cima do arquivo real sem antes conferir/fazer backup.
#
# Módulos exigidos: proxy, proxy_http, ssl, rewrite (checar com `apache2ctl -M`,
# habilitar com `a2enmod <nome>` se faltar — no servidor atual já estavam todos ativos).

# --- porta 80: /etc/apache2/sites-available/eventos.conf ---
<VirtualHost *:80>
    ServerName eventos.monkeycorp.com.br

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/eventos_error.log
    CustomLog ${APACHE_LOG_DIR}/eventos_access.log combined

RewriteEngine on
RewriteCond %{SERVER_NAME} =eventos.monkeycorp.com.br
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# --- porta 443: /etc/apache2/sites-available/eventos-le-ssl.conf ---
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName eventos.monkeycorp.com.br

    # Frontend — build estático do Vite (npm run build -> frontend/dist/),
    # transferido pra cá via scp. FallbackResource é necessário porque o Vue
    # Router usa createWebHistory — sem isso, recarregar uma rota tipo
    # /organizador/agenda direto no navegador dá 404 do Apache.
    DocumentRoot /var/www/eventos.monkeycorp.com.br
    <Directory /var/www/eventos.monkeycorp.com.br>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # API — proxy reverso pro backend Spring Boot, rodando via systemd só em
    # 127.0.0.1:8080 (nunca exposto direto). A barra final nos dois lados do
    # ProxyPass/ProxyPassReverse faz o mod_proxy remover o prefixo /api antes
    # de encaminhar — /api/auth/login chega no backend como /auth/login,
    # batendo com as rotas reais (sem prefixo) e com a whitelist do
    # AutenticacaoFiltro.
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/
    ProxyPassReverse /api/ http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/eventos_error.log
    CustomLog ${APACHE_LOG_DIR}/eventos_access.log combined

    # --- gerenciado pelo certbot, não editar manualmente ---
    SSLCertificateFile /etc/letsencrypt/live/eventos.monkeycorp.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/eventos.monkeycorp.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
